services:

  postgres:
    image: postgres:15
    container_name: processor-postgres
    restart: always
    environment:
      POSTGRES_DB: processor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: processor-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:5
    container_name: graylog-mongo
    restart: always
    volumes:
      - mongo_data:/data/db

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: graylog-opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  graylog:
    image: graylog/graylog:5.0
    container_name: processor-graylog
    restart: always
    depends_on:
      - mongodb
      - opensearch
    environment:
      GRAYLOG_PASSWORD_SECRET: some-random-secret
      GRAYLOG_ROOT_PASSWORD_SHA2: 937028455101d9001a3743459c297b7919c0028f35c7f73a3fba79668b37c3d0
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_MONGODB_URI: mongodb://graylog-mongo:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://graylog-opensearch:9200
    ports:
      - "9000:9000"
      - "12201:12201/udp"

volumes:
  postgres_data:
  mongo_data:
  opensearch_data: